<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知识总库</title>
  <link rel="stylesheet" href="/assets/vault.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="kicker">SPACES</div>
        <h1>知识总库</h1>
        <p class="lead">个人知识按空间分开存放。每个 space 是一套独立目录与正文，互不搅在一起。</p>
      </div>
    </div>
    <div class="spaces" id="spaces"></div>
    <p class="hint">新增空间：在 <code>cdn/public/spaces.json</code> 登记一项，并在 <code>cdn/public/s/空间id/</code> 放入该空间的阅读页。</p>
  </div>
  <script src="/assets/hub.js"></script>
</body>
</html>
